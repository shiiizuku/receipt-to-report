services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: r2r
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: r2r
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - r2r-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r2r -d r2r"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://r2r:${POSTGRES_PASSWORD}@db:5432/r2r
      SESSION_SECRET: ${SESSION_SECRET}
      SEED_PASSWORD: ${SEED_PASSWORD}
      # Set to "true" once the app is served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3470:3470"
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: r2r
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: r2r
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      KEEP_DAYS: ${KEEP_DAYS:-30}
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/backup.sh"]
    command: ["loop"]
volumes:
  r2r-data:
